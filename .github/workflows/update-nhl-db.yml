name: Mise à jour Base de Données LNH

on:
  schedule:
    # Exécuter tous les jours à 9:00 UTC (5:00 AM Heure de l'Est)
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Permet de lancer le script manuellement depuis l'interface GitHub

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécution de l'extraction LNH (Gratuit)
        run: node scripts/generate-free-db.js

      - name: Vérifier s'il y a des changements
        id: verify_diff
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit et Push des changements
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add src/data/players_generated.js
          git commit -m "🤖 Mise à jour automatique de la base de données LNH"
          git push
